name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test
      - name: Build and audit app bundle
        run: ./scripts/build-app.sh && ./scripts/check-app-bundle.sh
