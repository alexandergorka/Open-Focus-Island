name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build universal app
        run: |
          UNIVERSAL=1 ./scripts/build-app.sh
          lipo ".build/Open Focus Island.app/Contents/MacOS/OpenFocusIsland" -verify_arch arm64 x86_64

      - name: Package
        run: |
          zip="Open-Focus-Island-$APP_VERSION.zip"
          ditto -c -k --keepParent ".build/Open Focus Island.app" "$zip"
          echo "ZIP=$zip" >> "$GITHUB_ENV"
          echo "SHA=$(shasum -a 256 "$zip" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          ## Install

          **Homebrew**
          \`\`\`sh
          brew tap alexandergorka/open-focus-island https://github.com/alexandergorka/Open-Focus-Island
          brew install --cask alexandergorka/open-focus-island/open-focus-island
          \`\`\`

          **Manual:** download \`$ZIP\` below, unzip it and move **Open Focus Island.app** to \`/Applications\`.

          The app is not notarized by Apple yet, so macOS blocks the first launch. Open **System Settings > Privacy & Security** and click **Open Anyway**.

          Universal app (Apple Silicon + Intel), macOS 14 or later. SHA-256: \`$SHA\`
          NOTES
          gh release create "$GITHUB_REF_NAME" "$ZIP" --title "Open Focus Island $APP_VERSION" --notes-file notes.md --generate-notes

      - name: Update Homebrew cask on main
        run: |
          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD
          sed -i '' -e "s/^  version .*/  version \"$APP_VERSION\"/" -e "s/^  sha256 .*/  sha256 \"$SHA\"/" Casks/open-focus-island.rb
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "Update cask to $APP_VERSION"
          git push origin main
