name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: markdown
    attributes:
      value: |
        Open Focus Island deliberately stays offline and small: no accounts, telemetry, cloud sync or network access. See "Product direction" in the README.
